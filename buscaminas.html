<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscaminas - Bootstrap 5</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #faf9f5 !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .custom-card {
            background-color: #ffffff;
            border: 1px solid #e3e1d8;
        }
    </style>
</head>
<body class="min-vh-100 d-flex flex-column align-items-center justify-content-center p-3">

    <div class="card shadow-sm border-0 rounded-4 p-3 p-md-4 custom-card" style="max-width: 100%;">
        <div class="card-body d-flex flex-column align-items-center gap-3">
            
            <!-- Título -->
            <h1 class="h4 fw-bold text-dark mb-0">Buscaminas</h1>
            
            <!-- Selector de Dificultad -->
            <div class="btn-group shadow-sm" role="group">
                <button type="button" class="btn btn-sm btn-outline-secondary active diff-btn fw-semibold" data-difficulty="beginner">Principiante (9x9)</button>
                <button type="button" class="btn btn-sm btn-outline-secondary diff-btn fw-semibold" data-difficulty="intermediate">Intermedio (16x16)</button>
                <button type="button" class="btn btn-sm btn-outline-secondary diff-btn fw-semibold" data-difficulty="expert">Experto (30x16)</button>
            </div>

            <!-- Panel de Estado superior -->
            <div class="d-flex justify-content-between align-items-center w-100 bg-dark text-white p-3 rounded-3 font-monospace shadow-sm">
                <div class="badge bg-black text-danger fs-6 px-3 py-2 border border-secondary" id="mine-count">MIN: 010</div>
                <button class="btn btn-light btn-sm fw-bold px-3 py-1 shadow-sm" id="reset-btn">Reiniciar</button>
                <div class="badge bg-black text-danger fs-6 px-3 py-2 border border-secondary" id="timer">SEC: 000</div>
            </div>

            <!-- Contenedor del Tablero -->
            <div class="table-responsive border border-2 rounded-3 p-2 bg-white shadow-sm d-flex justify-content-center" style="max-height: 65vh; border-color: #e3e1d8 !important;">
                <div id="board" style="display: grid; gap: 1px; background-color: #dcd9ce;"></div>
            </div>

            <!-- Instrucciones de Ayuda -->
            <div class="form-text text-center text-muted small">
                Clic izquierdo para cavar. Clic derecho o mantener presionado para colocar/quitar bandera [F].
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Configuraciones de Dificultad
        const DIFFICULTIES = {
            beginner: { rows: 9, cols: 9, mines: 10 },
            intermediate: { rows: 16, cols: 16, mines: 40 },
            expert: { rows: 16, cols: 30, mines: 99 }
        };

        let currentDiff = 'beginner';
        let { rows, cols, mines } = DIFFICULTIES[currentDiff];

        let board = [];
        let mineLocations = [];
        let revealedCount = 0;
        let flagsCount = 0;
        let gameOver = false;
        let gameStarted = false;
        let timerInterval = null;
        let secondsElapsed = 0;

        // Elementos DOM
        const boardEl = document.getElementById('board');
        const mineCountEl = document.getElementById('mine-count');
        const timerEl = document.getElementById('timer');
        const resetBtn = document.getElementById('reset-btn');
        const diffBtns = document.querySelectorAll('.diff-btn');

        // Manejo de Dificultad
        diffBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                diffBtns.forEach(b => b.classList.remove('active', 'btn-dark'));
                diffBtns.forEach(b => b.classList.add('btn-outline-secondary'));
                
                e.target.classList.add('active', 'btn-dark');
                e.target.classList.remove('btn-outline-secondary');
                
                currentDiff = e.target.dataset.difficulty;
                const cfg = DIFFICULTIES[currentDiff];
                rows = cfg.rows;
                cols = cfg.cols;
                mines = cfg.mines;
                initGame();
            });
        });

        // Activar estilo inicial en el primer botón
        diffBtns[0].classList.add('btn-dark');
        diffBtns[0].classList.remove('btn-outline-secondary');

        resetBtn.addEventListener('click', initGame);

        function initGame() {
            boardEl.style.gridTemplateColumns = `repeat(${cols}, 28px)`;
            boardEl.style.gridTemplateRows = `repeat(${rows}, 28px)`;
            boardEl.innerHTML = '';
            
            board = [];
            mineLocations = [];
            revealedCount = 0;
            flagsCount = 0;
            gameOver = false;
            gameStarted = false;
            secondsElapsed = 0;
            clearInterval(timerInterval);
            timerEl.textContent = 'SEC: 000';
            updateMineDisplay();
            resetBtn.textContent = 'Reiniciar';
            resetBtn.classList.remove('btn-danger', 'btn-success');
            resetBtn.classList.add('btn-light');

            for (let r = 0; r < rows; r++) {
                let row = [];
                for (let c = 0; c < cols; c++) {
                    const cellData = {
                        r, c,
                        isMine: false,
                        revealed: false,
                        flagged: false,
                        neighborMines: 0
                    };
                    row.push(cellData);

                    const cellEl = document.createElement('div');
                    cellEl.className = 'd-flex align-items-center justify-content-center fw-bold rounded-1';
                    cellEl.style.width = '28px';
                    cellEl.style.height = '28px';
                    cellEl.style.backgroundColor = '#f3f1e8';
                    cellEl.style.cursor = 'pointer';
                    cellEl.style.fontSize = '0.85rem';
                    cellEl.dataset.row = r;
                    cellEl.dataset.col = c;

                    cellEl.addEventListener('click', () => handleCellClick(r, c));
                    cellEl.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        toggleFlag(r, c);
                    });

                    // Soporte táctil de presión prolongada para banderas en móviles
                    let pressTimer;
                    cellEl.addEventListener('touchstart', () => {
                        pressTimer = setTimeout(() => toggleFlag(r, c), 400);
                    });
                    cellEl.addEventListener('touchend', () => clearTimeout(pressTimer));

                    boardEl.appendChild(cellEl);
                }
                board.push(row);
            }
        }

        function generateMines(firstR, firstC) {
            let placedMines = 0;
            while (placedMines < mines) {
                let r = Math.floor(Math.random() * rows);
                let c = Math.floor(Math.random() * cols);
                let cellObj = board[r][c];
                let isNearFirst = Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1;

                if (!cellObj.isMine && !isNearFirst) {
                    cellObj.isMine = true;
                    mineLocations.push({ r, c });
                    placedMines++;
                }
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let cellObj = board[r][c];
                    if (!cellObj.isMine) {
                        let count = 0;
                        getNeighbors(r, c).forEach(n => {
                            if (board[n.r][n.c].isMine) count++;
                        });
                        cellObj.neighborMines = count;
                    }
                }
            }
        }

        function getNeighbors(r, c) {
            let neighbors = [];
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    let nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) neighbors.push({ r: nr, c: nc });
                }
            }
            return neighbors;
        }

        function handleCellClick(r, c) {
            if (gameOver) return;
            let cellObj = board[r][c];
            if (cellObj.revealed || cellObj.flagged) return;

            if (!gameStarted) {
                gameStarted = true;
                generateMines(r, c);
                startTimer();
            }

            if (cellObj.isMine) {
                revealAllMines(r, c);
                gameOver = true;
                clearInterval(timerInterval);
                resetBtn.textContent = 'Derrota';
                resetBtn.classList.remove('btn-light');
                resetBtn.classList.add('btn-danger');
                return;
            }

            revealCell(r, c);
            checkWinCondition();
        }

        function toggleFlag(r, c) {
            if (gameOver || !gameStarted) return;
            let cellObj = board[r][c];
            if (cellObj.revealed) return;

            let cellEl = getCellElement(r, c);
            if (!cellObj.flagged) {
                if (flagsCount >= mines) return;
                cellObj.flagged = true;
                flagsCount++;
                cellEl.textContent = 'F';
                cellEl.classList.add('text-danger');
            } else {
                cellObj.flagged = false;
                flagsCount--;
                cellEl.textContent = '';
                cellEl.classList.remove('text-danger');
            }
            updateMineDisplay();
        }

        function revealCell(r, c) {
            let cellObj = board[r][c];
            if (cellObj.revealed || cellObj.flagged) return;

            cellObj.revealed = true;
            revealedCount++;
            let cellEl = getCellElement(r, c);
            cellEl.style.backgroundColor = '#faf9f5';
            cellEl.style.border = '1px solid #e3e1d8';

            const numberColors = ['', '#0d6efd', '#198754', '#dc3545', '#6f42c1', '#fd7e14', '#0dcaf0', '#212529', '#6c757d'];

            if (cellObj.neighborMines > 0) {
                cellEl.textContent = cellObj.neighborMines;
                cellEl.style.color = numberColors[cellObj.neighborMines];
            } else {
                getNeighbors(r, c).forEach(n => revealCell(n.r, n.c));
            }
        }

        function revealAllMines(expR, expC) {
            mineLocations.forEach(m => {
                let cellEl = getCellElement(m.r, m.c);
                cellEl.style.backgroundColor = (m.r === expR && m.c === expC) ? '#dc3545' : '#f8d7da';
                cellEl.textContent = (m.r === expR && m.c === expC) ? 'X' : '*';
                cellEl.style.color = '#212529';
            });
        }

        function checkWinCondition() {
            if (revealedCount === (rows * cols) - mines) {
                gameOver = true;
                clearInterval(timerInterval);
                resetBtn.textContent = 'Victoria';
                resetBtn.classList.remove('btn-light');
                resetBtn.classList.add('btn-success');
                
                mineLocations.forEach(m => {
                    let cellEl = getCellElement(m.r, m.c);
                    if (!board[m.r][m.c].flagged) {
                        cellEl.textContent = 'F';
                        cellEl.classList.add('text-success');
                    }
                });
            }
        }

        function getCellElement(r, c) {
            return boardEl.children[r * cols + c];
        }

        function updateMineDisplay() {
            let rem = mines - flagsCount;
            let formatted = String(Math.abs(rem)).padStart(3, '0');
            if (rem < 0) formatted = '-' + formatted;
            mineCountEl.textContent = `MIN: ${formatted}`;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                secondsElapsed = Math.min(999, secondsElapsed + 1);
                timerEl.textContent = `SEC: ${String(secondsElapsed).padStart(3, '0')}`;
            }, 1000);
        }

        initGame();
    </script>
</body>
</html>
