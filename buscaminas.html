<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscaminas</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #b6ebeb;        /* fondo de página */
            --ink: #14181A;       /* texto */
            --muted: #444444;     /* texto secundario */
            --panel: #C0C0C0;     /* celdas y marco */
            --light: #FFFFFF;     /* borde superior-izq. (relieve) */
            --shadow: #808080;    /* borde inferior-der. */
            --dark: #404040;      /* contorno y número 8 */
            --mine: #FF0000;      /* mina / error / bandera */
            --led: #000000;       /* fondo de contadores */
        }
        body {
            background-color: var(--bg) !important;
            color: var(--ink);
            font-family: Helvetica, Arial, sans-serif;
        }
        /* Relieve elevado y hundido */
        .raised { border: 3px solid; border-color: var(--light) var(--shadow) var(--shadow) var(--light); }
        .sunken { border: 3px solid; border-color: var(--shadow) var(--light) var(--light) var(--shadow); }

        .game-frame {
            background: var(--panel);
            max-width: 100%;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .game-title { font-size: 1.4rem; font-weight: 700; color: var(--ink); margin: 0; }

        .gray-btn {
            background: var(--panel);
            color: var(--ink);
            font-size: .8rem;
            font-weight: 600;
            padding: 4px 10px;
            cursor: pointer;
            border: 3px solid;
            border-color: var(--light) var(--shadow) var(--shadow) var(--light);
            outline: 1px solid var(--dark);
        }
        .gray-btn:active, .gray-btn.active {
            border-color: var(--shadow) var(--light) var(--light) var(--shadow);
        }
        .gray-btn:focus-visible { outline: 2px solid var(--ink); }
        #reset-btn.defeat { background: var(--mine); color: #000; }
        #reset-btn.victory { font-weight: 800; }

        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 6px; gap: 8px;
            background: var(--panel);
        }
        .led {
            background: var(--led);
            color: var(--mine);
            font-family: monospace;
            font-size: 1.2rem;
            padding: 2px 8px;
            border: 2px solid;
            border-color: var(--shadow) var(--light) var(--light) var(--shadow);
            white-space: nowrap;
        }

        .board-wrap {
            max-height: 65vh;
            max-width: 100%;
            overflow: auto;
            display: flex;
            justify-content: center;
            border: 3px solid;
            border-color: var(--shadow) var(--light) var(--light) var(--shadow);
        }
        #board { display: grid; }

        .cell {
            width: 28px; height: 28px;
            box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;
            background: var(--panel);
            border: 3px solid;
            border-color: var(--light) var(--shadow) var(--shadow) var(--light);
            font-family: monospace;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        .cell.revealed {
            border: 1px solid var(--shadow);
            cursor: default;
        }
        .cell.flag { color: var(--mine); }
        .cell.mine { border: 1px solid var(--shadow); color: var(--ink); }
        .cell.boom { background: var(--mine); border: 1px solid var(--shadow); color: #000; }

        .help-text { font-size: .75rem; color: var(--muted); text-align: center; max-width: 340px; }
    </style>
</head>
<body class="min-vh-100 d-flex flex-column align-items-center justify-content-center p-3">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
      <div class="navbar-brand d-flex align-items-center" href="#">
        <img src="imagenes/logo.jpg" alt="Logo" width="50" height="50" class="me-2">
        Snake &amp; Buscaminas
      </div>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegación">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#snake">Snake</a></li>
          <li class="nav-item"><a class="nav-link" href="#buscaminas">Buscaminas</a></li>
        </ul>
      </div>
    </div>
  </nav>
    <div class="game-frame raised">
        
        <!-- Título -->
        <h1 class="game-title">Buscaminas</h1>

        <!-- Selector de Dificultad -->
        <div class="d-flex gap-2 flex-wrap justify-content-center" role="group">
            <button type="button" class="gray-btn diff-btn active" data-difficulty="beginner">Principiante (9x9)</button>
            <button type="button" class="gray-btn diff-btn" data-difficulty="intermediate">Intermedio (16x16)</button>
            <button type="button" class="gray-btn diff-btn" data-difficulty="expert">Experto (30x16)</button>
        </div>

        <!-- Panel de Estado superior -->
        <div class="status-bar sunken">
            <div class="led" id="mine-count">MIN: 010</div>
            <button class="gray-btn fw-bold" id="reset-btn">Reiniciar</button>
            <div class="led" id="timer">SEC: 000</div>
        </div>

        <!-- Contenedor del Tablero -->
        <div class="board-wrap">
            <div id="board"></div>
        </div>

        <!-- Instrucciones de Ayuda -->
        <div class="help-text">
            Clic izquierdo para cavar. Clic derecho o mantener presionado para colocar/quitar bandera [F].
        </div>

    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Configuraciones de Dificultad
        const DIFFICULTIES = {
            beginner: { rows: 9, cols: 9, mines: 10 },
            intermediate: { rows: 16, cols: 16, mines: 40 },
            expert: { rows: 16, cols: 30, mines: 99 }
        };

        // Números 1-8 (tonos ajustados a 4.5:1 sobre #C0C0C0)
        const NUMBER_COLORS = ['', '#0000FF', '#005A00', '#A00000', '#000080', '#800000', '#005050', '#000000', '#404040'];

        let currentDiff = 'beginner';
        let { rows, cols, mines } = DIFFICULTIES[currentDiff];

        let board = [];
        let mineLocations = [];
        let revealedCount = 0;
        let flagsCount = 0;
        let gameOver = false;
        let gameStarted = false;
        let timerInterval = null;
        let secondsElapsed = 0;

        // Elementos DOM
        const boardEl = document.getElementById('board');
        const mineCountEl = document.getElementById('mine-count');
        const timerEl = document.getElementById('timer');
        const resetBtn = document.getElementById('reset-btn');
        const diffBtns = document.querySelectorAll('.diff-btn');

        // Manejo de Dificultad
        diffBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                diffBtns.forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');

                currentDiff = e.currentTarget.dataset.difficulty;
                const cfg = DIFFICULTIES[currentDiff];
                rows = cfg.rows;
                cols = cfg.cols;
                mines = cfg.mines;
                initGame();
            });
        });

        resetBtn.addEventListener('click', initGame);

        function initGame() {
            boardEl.style.gridTemplateColumns = `repeat(${cols}, 28px)`;
            boardEl.style.gridTemplateRows = `repeat(${rows}, 28px)`;
            boardEl.innerHTML = '';

            board = [];
            mineLocations = [];
            revealedCount = 0;
            flagsCount = 0;
            gameOver = false;
            gameStarted = false;
            secondsElapsed = 0;
            clearInterval(timerInterval);
            timerEl.textContent = 'SEC: 000';
            updateMineDisplay();
            resetBtn.textContent = 'Reiniciar';
            resetBtn.classList.remove('defeat', 'victory');

            for (let r = 0; r < rows; r++) {
                let row = [];
                for (let c = 0; c < cols; c++) {
                    row.push({ r, c, isMine: false, revealed: false, flagged: false, neighborMines: 0 });

                    const cellEl = document.createElement('div');
                    cellEl.className = 'cell';
                    cellEl.dataset.row = r;
                    cellEl.dataset.col = c;

                    cellEl.addEventListener('click', () => handleCellClick(r, c));
                    cellEl.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        toggleFlag(r, c);
                    });

                    // Soporte táctil de presión prolongada para banderas en móviles
                    let pressTimer;
                    cellEl.addEventListener('touchstart', () => {
                        pressTimer = setTimeout(() => toggleFlag(r, c), 400);
                    });
                    cellEl.addEventListener('touchend', () => clearTimeout(pressTimer));

                    boardEl.appendChild(cellEl);
                }
                board.push(row);
            }
        }

        function generateMines(firstR, firstC) {
            let placedMines = 0;
            while (placedMines < mines) {
                let r = Math.floor(Math.random() * rows);
                let c = Math.floor(Math.random() * cols);
                let cellObj = board[r][c];
                let isNearFirst = Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1;

                if (!cellObj.isMine && !isNearFirst) {
                    cellObj.isMine = true;
                    mineLocations.push({ r, c });
                    placedMines++;
                }
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let cellObj = board[r][c];
                    if (!cellObj.isMine) {
                        let count = 0;
                        getNeighbors(r, c).forEach(n => {
                            if (board[n.r][n.c].isMine) count++;
                        });
                        cellObj.neighborMines = count;
                    }
                }
            }
        }

        function getNeighbors(r, c) {
            let neighbors = [];
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    let nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) neighbors.push({ r: nr, c: nc });
                }
            }
            return neighbors;
        }

        function handleCellClick(r, c) {
            if (gameOver) return;
            let cellObj = board[r][c];
            if (cellObj.revealed || cellObj.flagged) return;

            if (!gameStarted) {
                gameStarted = true;
                generateMines(r, c);
                startTimer();
            }

            if (cellObj.isMine) {
                revealAllMines(r, c);
                gameOver = true;
                clearInterval(timerInterval);
                resetBtn.textContent = 'Derrota';
                resetBtn.classList.add('defeat');
                return;
            }

            revealCell(r, c);
            checkWinCondition();
        }

        function toggleFlag(r, c) {
            if (gameOver || !gameStarted) return;
            let cellObj = board[r][c];
            if (cellObj.revealed) return;

            let cellEl = getCellElement(r, c);
            if (!cellObj.flagged) {
                if (flagsCount >= mines) return;
                cellObj.flagged = true;
                flagsCount++;
                cellEl.textContent = 'F';
                cellEl.classList.add('flag');
            } else {
                cellObj.flagged = false;
                flagsCount--;
                cellEl.textContent = '';
                cellEl.classList.remove('flag');
            }
            updateMineDisplay();
        }

        function revealCell(r, c) {
            let cellObj = board[r][c];
            if (cellObj.revealed || cellObj.flagged) return;

            cellObj.revealed = true;
            revealedCount++;
            let cellEl = getCellElement(r, c);
            cellEl.classList.add('revealed');

            if (cellObj.neighborMines > 0) {
                cellEl.textContent = cellObj.neighborMines;
                cellEl.style.color = NUMBER_COLORS[cellObj.neighborMines];
            } else {
                getNeighbors(r, c).forEach(n => revealCell(n.r, n.c));
            }
        }

        function revealAllMines(expR, expC) {
            mineLocations.forEach(m => {
                let cellEl = getCellElement(m.r, m.c);
                const exploded = (m.r === expR && m.c === expC);
                cellEl.classList.remove('flag');
                cellEl.classList.add(exploded ? 'boom' : 'mine');
                cellEl.textContent = exploded ? 'X' : '*';
            });
        }

        function checkWinCondition() {
            if (revealedCount === (rows * cols) - mines) {
                gameOver = true;
                clearInterval(timerInterval);
                resetBtn.textContent = 'Victoria';
                resetBtn.classList.add('victory');

                mineLocations.forEach(m => {
                    let cellEl = getCellElement(m.r, m.c);
                    if (!board[m.r][m.c].flagged) {
                        cellEl.textContent = 'F';
                        cellEl.classList.add('flag');
                    }
                });
            }
        }

        function getCellElement(r, c) {
            return boardEl.children[r * cols + c];
        }

        function updateMineDisplay() {
            let rem = mines - flagsCount;
            let formatted = String(Math.abs(rem)).padStart(3, '0');
            if (rem < 0) formatted = '-' + formatted;
            mineCountEl.textContent = `MIN: ${formatted}`;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                secondsElapsed = Math.min(999, secondsElapsed + 1);
                timerEl.textContent = `SEC: ${String(secondsElapsed).padStart(3, '0')}`;
            }, 1000);
        }

        initGame();
    </script>
</body>
</html>
